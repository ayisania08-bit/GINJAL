<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sistem Pakar Penyakit Ginjal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#e3f2fd,#ffffff);
    margin:0;
}
header{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    padding:30px;
    text-align:center;
}
.container{
    width:600px;
    margin:40px auto;
}
.card{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
    text-align:center;
}
h3{ color:#1e3c72; }
.pertanyaan{
    font-size:20px;
    margin:25px 0;
}
button{
    width:45%;
    padding:14px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
}
.btn-ya{ background:#27ae60; color:white; }
.btn-tidak{ background:#c0392b; color:white; }
.btn-reset{ background:#f39c12; color:white; width:100%; }
.btn-download{ background:#2980b9; color:white; width:100%; }

.hasil{
    text-align:left;
    margin-top:20px;
}
.penyakit{
    background:#f4f9ff;
    padding:15px;
    border-radius:10px;
    border-left:6px solid #27ae60;
    margin-bottom:15px;
}
footer{
    text-align:center;
    padding:15px;
    color:#777;
}
</style>
</head>

<body>

<header>
<h2>💊 Sistem Pakar Deteksi Penyakit Ginjal</h2>
<p>Metode Forward Chaining</p>
</header>

<div class="container">
<div class="card">

<h3 id="judul">Pertanyaan 1</h3>
<div class="pertanyaan" id="pertanyaan"></div>

<div id="btnJawab">
<button class="btn-ya" onclick="jawab(true)">YA</button>
<button class="btn-tidak" onclick="jawab(false)">TIDAK</button>
</div>

<div class="hasil" id="hasil"></div>

<button class="btn-download" onclick="downloadHasil()" style="display:none">📥 Download Hasil</button>
<button class="btn-reset" onclick="resetDiagnosa()" style="display:none">🔄 Diagnosa Ulang</button>

</div>
</div>

<footer>
© 2025 Sistem Pakar Penyakit Ginjal
</footer>

<script>
// ================= DATA =================
const pertanyaanList = [
 {kode:"G1", teks:"Apakah Anda mengalami nyeri pinggang?"},
 {kode:"G2", teks:"Apakah Anda merasakan nyeri saat buang air kecil?"},
 {kode:"G3", teks:"Apakah Anda mengalami demam?"},
 {kode:"G11", teks:"Apakah kaki Anda mengalami pembengkakan?"},
 {kode:"G14", teks:"Apakah urin Anda berwarna merah atau coklat?"},
 {kode:"G22", teks:"Apakah tekanan darah Anda tinggi?"}
];

const rules = [
{
 nama:"Gagal Ginjal Kronis",
 gejala:["G11","G14","G22"],
 solusi:[
  "Mengurangi konsumsi garam",
  "Mengontrol tekanan darah",
  "Mengatur asupan cairan",
  "Menghindari rokok dan alkohol"
 ]
},
{
 nama:"Batu Ginjal",
 gejala:["G1","G2","G14"],
 solusi:[
  "Minum air putih 2–3 liter per hari",
  "Menghindari makanan tinggi oksalat",
  "Tidak menahan buang air kecil"
 ]
},
{
 nama:"Infeksi Ginjal",
 gejala:["G2","G3","G14"],
 solusi:[
  "Istirahat cukup",
  "Perbanyak minum air",
  "Menjaga kebersihan saluran kemih"
 ]
}
];

// ================= LOGIKA =================
let index = 0;
let fakta = [];
let hasilText = "";

tampilPertanyaan();

function tampilPertanyaan(){
 document.getElementById("pertanyaan").innerText = pertanyaanList[index].teks;
 document.getElementById("judul").innerText = "Pertanyaan " + (index + 1);
}

function jawab(ya){
 if(ya){
  fakta.push(pertanyaanList[index].kode);
 }
 index++;
 if(index < pertanyaanList.length){
  tampilPertanyaan();
 } else {
  prosesDiagnosa();
 }
}

function prosesDiagnosa(){
 document.getElementById("btnJawab").style.display="none";
 let html="<h3>📊 Hasil Diagnosa</h3>";
 hasilText="HASIL DIAGNOSA SISTEM PAKAR\n\n";

 let ada=false;

 rules.forEach(r=>{
  let cocok = r.gejala.filter(g => fakta.includes(g)).length;
  let persen = Math.round((cocok / r.gejala.length) * 100);

  if(persen >= 50){
   ada=true;
   html+=`<div class="penyakit"><b>${r.nama}</b><br>
   <small>Tingkat kecocokan: ${persen}%</small><ul>`;
   hasilText+=`Penyakit: ${r.nama}\nKecocokan: ${persen}%\nSolusi:\n`;

   r.solusi.forEach(s=>{
    html+=`<li>${s}</li>`;
    hasilText+=`- ${s}\n`;
   });

   html+="</ul></div>";
   hasilText+="\n";
  }
 });

 if(!ada){
  html+="❌ Gejala belum cukup untuk menentukan penyakit.";
 }

 document.getElementById("hasil").innerHTML = html;
 document.querySelector(".btn-download").style.display="block";
 document.querySelector(".btn-reset").style.display="block";
}

function resetDiagnosa(){
 index=0;
 fakta=[];
 hasilText="";
 document.getElementById("hasil").innerHTML="";
 document.getElementById("btnJawab").style.display="block";
 document.querySelector(".btn-download").style.display="none";
 document.querySelector(".btn-reset").style.display="none";
 tampilPertanyaan();
}

function downloadHasil(){
 const blob = new Blob([hasilText], {type:"text/plain"});
 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "hasil_diagnosa_ginjal.txt";
 a.click();
}
</script>

</body>
</html>
